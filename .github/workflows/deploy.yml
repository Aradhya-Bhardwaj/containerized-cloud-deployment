name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/mern-backend:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/mern-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and Deploy
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Writing Docker environment configuration..."
            echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" > .env
            
            # Recreate docker-compose.yml file on the remote server
            cat << 'EOF' > docker-compose.yml
            version: '3.8'
            services:
              backend:
                image: ${DOCKER_USERNAME}/mern-backend:latest
                container_name: mern-backend
                ports:
                  - "5000:5000"
                environment:
                  - PORT=5000
                restart: unless-stopped
              frontend:
                image: ${DOCKER_USERNAME}/mern-frontend:latest
                container_name: mern-frontend
                ports:
                  - "80:80"
                depends_on:
                  - backend
                restart: unless-stopped
            EOF

            # Execute deployment
            sudo docker-compose pull
            sudo docker-compose down
            sudo docker-compose up -d
